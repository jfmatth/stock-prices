# https://opensource.zalando.com/postgres-operator/

kind: "postgresql"
apiVersion: "acid.zalan.do/v1"

metadata:
  name: "stockprices"
  labels:
    team: acid
  namespace: stocks

spec:
  teamId: "acid"
  postgresql:
    version: "15"
  numberOfInstances: 1

  # enableMasterLoadBalancer: true
  volume:
    size: "2Gi"

  resources:
    requests:
      cpu: 100m
      memory: 250Mi
    limits:
      cpu: 2500m
      memory: 3000Mi

  users:
    django: []

  databases:
    stockprices: django

# https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/#using-environment-variables-inside-of-your-config